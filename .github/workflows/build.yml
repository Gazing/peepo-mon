name: ROM build

# Compile-check every push / PR to the peepo branch so collaborators get a clear
# green/red signal that the ROM still builds. Mirrors the local builder image
# (ubuntu 22.04 + gcc-arm-none-eabi 10.x, `make MODERN=1`).
#
# NOTE: the built ROM is NOT uploaded — it is Nintendo IP and this repo is public. This job
# proves the source compiles, then (on a push to peepo only) pings the MAIN repo's deploy
# workflow, which rebuilds the ROM from source and ships it as a static asset — see the
# "Trigger main-repo deploy" step. No Cloudflare/ROM artifacts ever leave this repo.

# Only run when something that can actually affect the ROM changes — a docs/CI-only commit
# shouldn't burn a ~2.5 min build (and, on push, shouldn't trigger a redeploy either).
# (GitHub Actions doesn't expand YAML anchors, so the list is duplicated.)
on:
  push:
    branches: [peepo]
    paths:
      - "src/**"
      - "gflib/**"
      - "include/**"
      - "data/**"
      - "graphics/**"
      - "sound/**"
      - "asm/**"
      - "tools/**"
      - "libagbsyscall/**"
      - "Makefile"
      - "**/*.mk"
      - "ld_script*.ld"
      - "charmap.txt"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [peepo]
    paths:
      - "src/**"
      - "gflib/**"
      - "include/**"
      - "data/**"
      - "graphics/**"
      - "sound/**"
      - "asm/**"
      - "tools/**"
      - "libagbsyscall/**"
      - "Makefile"
      - "**/*.mk"
      - "ld_script*.ld"
      - "charmap.txt"
      - ".github/workflows/build.yml"

# A newer push to the same ref cancels the in-flight build.
concurrency:
  group: rom-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (modern)
    runs-on: ubuntu-22.04 # pinned: gives gcc-arm-none-eabi 10.x, matching the builder image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cache the downloaded .debs so repeat runs skip re-fetching the ARM toolchain (~20-30s).
      # apt still installs them each run; only the download is saved.
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-arm-toolchain-ubuntu2204-v1

      - name: Install ARM toolchain + deps
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update -qq
          sudo apt-get -o Dir::Cache::archives="$HOME/apt-cache" install -y -qq \
            build-essential binutils-arm-none-eabi gcc-arm-none-eabi \
            libnewlib-arm-none-eabi libpng-dev python3
          # apt writes as root; hand it back so actions/cache can save the dir
          sudo chown -R "$(id -u):$(id -g)" ~/apt-cache

      - name: Build ROM
        run: make MODERN=1 -j"$(nproc)"

      # A merged ROM change (push to peepo) tells the MAIN repo to redeploy — it rebuilds this
      # ROM from source + ships it. Uses workflow_dispatch via the API with a fine-grained PAT
      # scoped to "Actions: write" on the main repo ONLY (a leak could then only trigger deploys
      # — not read secrets or push code). Never on PRs. Skips cleanly if the token isn't set, and
      # a dispatch failure only warns (the ROM build check itself stays authoritative).
      - name: Trigger main-repo deploy
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.MAIN_DEPLOY_TOKEN }}
          REF: ${{ vars.MAIN_DEPLOY_REF || 'master' }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "MAIN_DEPLOY_TOKEN not set — skipping deploy trigger."; exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Gazing/discord-gpt2-bot/actions/workflows/peepoactivity-deploy.yml/dispatches" \
            -d "{\"ref\":\"$REF\"}")
          echo "Deploy dispatch -> HTTP $code (204 = success)."
          [ "$code" = "204" ] || echo "::warning::deploy trigger returned $code, not 204 (check MAIN_DEPLOY_TOKEN scope + that peepoactivity-deploy.yml exists on ref '$REF')"
